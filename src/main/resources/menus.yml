schema-version: 1

progress:
  segments: 10
  filled-character: "▰"
  empty-character: "▱"
  empty-color: "#4B5563"
  thresholds:
    0: "#FF6B6B"
    25: "#FF9F43"
    50: "#FFD166"
    75: "#72E6A6"
    100: "#72F1B8"

common:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  close:
    material: BARRIER
    name: "<red><bold>Close</bold>"
    lore: ["<gray>Close this journal."]
  back:
    material: ARROW
    name: "<yellow><bold>Back</bold>"
    lore: ["<gray>Return to the previous view."]
  previous:
    material: SPECTRAL_ARROW
    name: "<yellow><bold>Previous Page</bold>"
    lore: ["<gray>Page <white><page></white>/<white><pages></white>"]
  next:
    material: SPECTRAL_ARROW
    name: "<yellow><bold>Next Page</bold>"
    lore: ["<gray>Page <white><page></white>/<white><pages></white>"]

journal:
  title: "<gradient:#56B9F2:#92E1FF><bold>Quest Journal</bold></gradient>"
  size: 54
  quest-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  previous-slot: 45
  summary-slot: 46
  pinned-slot: 47
  settings-slot: 48
  filter-slot: 49
  help-slot: 50
  history-slot: 51
  next-slot: 52
  close-slot: 53
  tabs:
    daily: {slot: 0, material: SUNFLOWER, name: "<yellow><bold>Daily</bold>"}
    weekly: {slot: 1, material: CLOCK, name: "<aqua><bold>Weekly</bold>"}
    milestones: {slot: 2, material: NETHER_STAR, name: "<light_purple><bold>Milestones</bold>"}
    manual: {slot: 3, material: WRITABLE_BOOK, name: "<green><bold>Assigned</bold>"}
    all: {slot: 4, material: KNOWLEDGE_BOOK, name: "<white><bold>All Quests</bold>"}
  summary:
    material: PLAYER_HEAD
    name: "<gradient:#56B9F2:#92E1FF><bold><player>'s Journal</bold></gradient>"
    lore:
      - "<gray>Rank category <white><rank_category>"
      - "<gray>Active quests <white><active>"
      - "<gray>Ready to claim <green><claimable>"
      - "<gray>Completed total <white><completed_total>"
      - ""
      - "<gray>Slots <white><used_slots><dark_gray>/</dark_gray><white><slot_limit>"
      - "<gray>Rerolls left <white><rerolls>"
  pinned:
    material: RECOVERY_COMPASS
    name: "<aqua><bold>Pinned Quest</bold>"
    lore:
      - "<gray><pinned_name>"
      - "<progress_bar> <progress_color><percentage>%"
      - ""
      - "<yellow>Click <gray>to open"
  settings:
    material: COMPARATOR
    name: "<yellow><bold>Feedback Settings</bold>"
    lore: ["<gray>Choose how quest progress is shown."]
  filter:
    material: HOPPER
    name: "<aqua><bold>Status Filter</bold>"
    lore:
      - "<gray>Current <white><filter>"
      - ""
      - "<yellow>Click <gray>to cycle"
  help:
    material: ENCHANTED_BOOK
    name: "<green><bold>How Quests Work</bold>"
    lore:
      - "<gray>Complete objectives during normal play."
      - "<gray>Claim finished rewards from details."
      - ""
      - "<yellow>Left-click <gray>details"
      - "<aqua>Right-click <gray>pin or unpin"
      - "<light_purple>Shift-left-click <gray>reroll"
  history:
    material: BOOK
    name: "<light_purple><bold>Quest History</bold>"
    lore: ["<gray>Review claimed, expired, and completed quests."]
  empty:
    material: GRAY_DYE
    name: "<gray><bold>No quests here</bold>"
    lore: ["<dark_gray>Try another scope or status filter."]
  quest-card:
    lore:
      - "<dark_gray><scope> • <rarity>"
      - ""
      - "<gray><description>"
      - ""
      - "{objectives}"
      - ""
      - "<gray>Progress <progress_color><current></progress_color><dark_gray>/</dark_gray><white><required>"
      - "<progress_bar> <dark_gray>(</dark_gray><progress_color><percentage>%</progress_color><dark_gray>)</dark_gray>"
      - "<gray>Time <white><time_left>"
      - ""
      - "{rewards}"
      - ""
      - "<yellow>Left-click <gray>for details"
      - "<aqua>Right-click <gray>to <pin_action>"
      - "<light_purple>Shift-left-click <gray>to reroll"

details:
  title: "<gradient:#56B9F2:#92E1FF><bold>Quest Details</bold></gradient>"
  size: 54
  icon-slot: 4
  objective-slots: [19, 20, 21, 22, 23, 24, 25]
  reward-slots: [29, 30, 31, 32, 33, 34]
  back-slot: 45
  pin-slot: 47
  reroll-slot: 49
  claim-slot: 51
  close-slot: 53
  objective:
    active-material: LIME_DYE
    locked-material: GRAY_DYE
    complete-material: EMERALD
    name: "<objective_state_color><bold><objective_name></bold>"
    lore:
      - "<gray><objective_description>"
      - ""
      - "<progress_bar> <progress_color><current></progress_color><dark_gray>/</dark_gray><white><required>"
      - "<gray>Remaining <white><remaining>"
      - "{filters}"
  claim:
    material: CHEST
    name: "<green><bold>Claim Rewards</bold>"
    lore:
      - "{rewards}"
      - ""
      - "<yellow>Click <gray>to claim safely"
  claim-locked:
    material: MINECART
    name: "<gray><bold>Rewards Locked</bold>"
    lore: ["<dark_gray>Finish the quest objectives first."]
  reroll:
    material: ENDER_EYE
    name: "<light_purple><bold>Reroll Quest</bold>"
    lore:
      - "<gray>Free rerolls left <white><free_rerolls>"
      - "<gray>Cost <white><reroll_cost>"
      - ""
      - "<yellow>Click <gray>for confirmation"
  pin:
    material: RECOVERY_COMPASS
    name: "<aqua><bold><pin_action_title></bold>"
    lore: ["<gray>Track this quest outside the journal."]

confirmation:
  title: "<gradient:#C850C0:#FF7EB3><bold>Confirm Reroll</bold></gradient>"
  size: 27
  quest-slot: 13
  confirm-slot: 11
  cancel-slot: 15
  confirm:
    material: LIME_CONCRETE
    name: "<green><bold>Confirm Reroll</bold>"
    lore:
      - "<gray>A valid replacement is already reserved."
      - "<gray>Current progress will be lost."
      - "<gray>Cost <white><reroll_cost>"
  cancel:
    material: RED_CONCRETE
    name: "<red><bold>Keep Current Quest</bold>"
    lore: ["<gray>No progress or currency will be consumed."]

settings:
  title: "<gradient:#56B9F2:#92E1FF><bold>Quest Feedback</bold></gradient>"
  size: 36
  toggle-slots:
    actionbar: 10
    bossbar: 11
    progress-sounds: 12
    completion-sounds: 13
    particles: 14
    titles: 15
    join-reminders: 16
    reduced-motion: 22
  back-slot: 31
  enabled-material: LIME_DYE
  disabled-material: GRAY_DYE
  toggle-name: "<state_color><bold><setting_name></bold>"
  toggle-lore:
    - "<gray><setting_description>"
    - ""
    - "<gray>State <state_color><state>"
    - "<yellow>Click <gray>to toggle"

history:
  title: "<gradient:#C850C0:#FF7EB3><bold>Quest History</bold></gradient>"
  size: 54
  entry-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  previous-slot: 45
  back-slot: 49
  next-slot: 53

admin:
  title: "<gradient:#FF9F43:#FFD166><bold>Quest Administration</bold></gradient>"
  size: 54
  health-slots: [10, 11, 12, 13, 14, 15, 16]
  quest-slots: [28, 29, 30, 31, 32, 33, 34]
  previous-slot: 45
  validate-slot: 47
  reload-slot: 48
  close-slot: 49
  save-slot: 50
  next-slot: 53
  health:
    loaded: {material: KNOWLEDGE_BOOK, name: "<aqua><bold>Registry</bold>"}
    assignments: {material: WRITABLE_BOOK, name: "<green><bold>Assignments</bold>"}
    database: {material: CHEST_MINECART, name: "<yellow><bold>Database</bold>"}
    queue: {material: HOPPER, name: "<light_purple><bold>Write Queue</bold>"}
    integrations: {material: REDSTONE, name: "<red><bold>Integrations</bold>"}
    origin: {material: GRASS_BLOCK, name: "<green><bold>Block Origins</bold>"}
    uncertainty: {material: TRIPWIRE_HOOK, name: "<gold><bold>Claim Review</bold>"}

