schema-version: 2

locale: en_US

# Core 2 runtime acquisition/origin authority.
# AUTO   = use Core when it is safely authoritative, otherwise local fallback.
# CORE   = require Core Runtime + safe origin import support.
# LOCAL  = keep PlexonQuests local block acquisition/provenance authority.
# SHADOW = use Core event acquisition, keep local provenance authoritative, and compare Core/local origin.
# Changing authority mode requires a server restart.
core-runtime:
  mode: AUTO

rotation:
  timezone: America/Sao_Paulo
  daily-reset: "04:00"
  weekly-reset-day: MONDAY
  weekly-reset-time: "04:00"
  completed-claim-grace: 24h
  recent-history-exclusion: 7d

# 4.1 slot keys are retained as Daily/Weekly period participation budgets.
assignments:
  base-daily-slots: 3
  base-weekly-slots: 2
  maximum-daily-slots: 9
  maximum-weekly-slots: 5
  maximum-active-manual: 20
  allow-one-action-to-progress-multiple-quests: true

participation:
  maximum-active-quests: 1
  allow-abandon: true
  abandon-consumes-period-budget: true
  manual-assignments-count-toward-limit: true

catalog:
  daily-offers: 7
  weekly-offers: 7
  refresh-on-period-change: true

skills-display:
  enabled: true
  provider: PLEXON_SKILLS
  category-map:
    mining: MINING
    woodcutting: WOODCUTTING
    excavation: EXCAVATION
    farming: FARMING
    fishing: FISHING
    alchemy: ALCHEMY

rank-progression:
  enabled: true
  provider: PLEXON_RANKS
  fallback-permissions: true
  bonus-per-category: 1
  categories:
    default: 0
    newbie: 1
    tinkerer: 2
    technician: 3
    inventor: 4
    skilled: 5
    pro: 6

# Retained for command/API compatibility. The normal player board no longer needs rerolls.
rerolls:
  enabled: true
  free-daily: 1
  free-weekly: 1
  maximum-per-period: 3
  progress-policy: LOSE_AFTER_CONFIRMATION
  paid:
    enabled: false
    cost: 2500.0
    provider: VAULT

tracking:
  creative-counts: false
  spectator-counts: false
  natural-block-mode: PERSISTENT_CHUNK
  natural-block-maximum-positions-per-chunk: 65536
  travel-sample-ticks: 20
  travel-maximum-delta: 32.0
  actionbar-throttle-ticks: 10
  bossbar-throttle-ticks: 10
  bossbar-quiet-period: 4s
  afk-timeout: 5m
  contribution-cooldown-ms: 0

storage:
  file: plexonquests.db
  journal-mode: WAL
  busy-timeout-ms: 5000
  flush-interval: 5s
  checkpoint-interval: 5m
  queue-capacity: 4096
  shutdown-timeout: 15s
  history-retention-days: 180
  history-maximum-per-player: 500

claims:
  manual-by-default: true
  overflow-policy: CANCEL
  audit-log: true
  reservation-timeout: 30s

integrations:
  placeholderapi: AUTO
  vault: AUTO
  luckperms: AUTO
  plexonranks: AUTO
  plexontools: AUTO
  plexonkeys: AUTO
  plexoncrates: AUTO
  plexonshops: AUTO
  plexondailyrewards: AUTO
  plexonskills: AUTO

text:
  placeholder-rendering:
    default: SAFE
    allow-legacy: true
    allow-minimessage: true

feedback:
  join-reminder-delay: 40t
  failure-message-cooldown: 2s
  pinned-display: AUTO
  maximum-pinned: 1
  progress-thresholds: [25, 50, 75, 100]

security:
  command-cooldown-ms: 250
  gui-click-cooldown-ms: 120
  maximum-numbered-permission: 20
  maximum-serialized-item-bytes: 65536

diagnostics:
  debug-timing: false
  timing-sample-rate: 1000

privacy:
  log-player-uuids: true
  log-player-names: true
  expose-database-path-in-player-errors: false
