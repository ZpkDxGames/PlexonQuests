name: Align objective presentation with MiniMessage contract

on:
  push:
    branches: [revamp/4.1.0-full-standard]
    paths: ['.github/workflows/revamp-objective-presentation-sweep.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/4.1.0-full-standard
          fetch-depth: 0
      - name: Patch objective renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("src/main/java/com/zpkdxgames/plexonquests/gui/QuestItemRenderer.java"); s=p.read_text(); old="                \"objective_state_color\", stateColor,\n                \"objective_name\", objective.definition().display(),\n                \"objective_state\", locked ? \"Locked\" : objective.complete() ? \"Complete\" : \"In progress\","; new="                \"objective_state_color\", stateColor,\n                \"objective_state\", locked ? \"Locked\" : objective.complete() ? \"Complete\" : \"In progress\","; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("src/main/java/com/zpkdxgames/plexonquests/gui/QuestItemRenderer.java"); s=p.read_text(); old="        Map<String, Component> components = Map.of(\"progress_bar\", text.progressBar(percentage));\n        List<Component> filters = filterSummary(objective);"; new="        Map<String, Component> components = Map.of(\n                \"objective_name\", text.parse(objective.definition().display()),\n                \"progress_bar\", text.progressBar(percentage));\n        List<Component> filters = filterSummary(objective);"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("src/main/java/com/zpkdxgames/plexonquests/gui/QuestItemRenderer.java"); s=p.read_text(); old="                text.parse(configs.snapshot().menus().string(\"details.objective.name\", \"<white><objective_name>\"), values),"; new="                text.parse(\n                        null,\n                        configs.snapshot().menus().string(\"details.objective.name\", \"<white><objective_name>\"),\n                        values,\n                        components),"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("src/main/java/com/zpkdxgames/plexonquests/gui/QuestItemRenderer.java"); s=p.read_text(); old="            output.add(text.parse(\n                    icon + \" <gray><name> <progress_color><current></progress_color><dark_gray>/</dark_gray><white><required>\",\n                    text.placeholders(\n                            \"name\", objective.definition().display(),\n                            \"progress_color\", text.progressColor(objective.required() == 0L\n                                    ? 0D : objective.current() * 100D / objective.required()),\n                            \"current\", formatObjectiveValue(objective, objective.current()),\n                            \"required\", formatObjectiveValue(objective, objective.required()))));"; new="            output.add(text.parse(\n                    null,\n                    icon + \" <gray><name> <progress_color><current></progress_color><dark_gray>/</dark_gray><white><required>\",\n                    text.placeholders(\n                            \"progress_color\", text.progressColor(objective.required() == 0L\n                                    ? 0D : objective.current() * 100D / objective.required()),\n                            \"current\", formatObjectiveValue(objective, objective.current()),\n                            \"required\", formatObjectiveValue(objective, objective.required())),\n                    Map.of(\"name\", text.parse(objective.definition().display()))));"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          git diff --check
      - name: Commit objective presentation sweep
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/revamp-objective-presentation-sweep.yml
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add src/main/java/com/zpkdxgames/plexonquests/gui/QuestItemRenderer.java
          git diff --cached --check
          git commit -m 'Render configured objective MiniMessage consistently'
          git push origin HEAD:revamp/4.1.0-full-standard
