name: Finish 4.1 presentation consistency sweep

on:
  push:
    branches: [revamp/4.1.0-full-standard]
    paths: ['.github/workflows/revamp-presentation-sweep.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/4.1.0-full-standard
          fetch-depth: 0
      - name: Patch compatibility presentation paths
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("src/main/java/com/zpkdxgames/plexonquests/gui/MenuService.java"); s=p.read_text(); old="                    text.parse(\"<gray>Rewards <white>\" + entry.rewardSummary()),"; new="                    text.parse(\"<gray>Rewards <white>\" + historyRewardSummary(entry.rewardSummary())),"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("src/main/java/com/zpkdxgames/plexonquests/gui/MenuService.java"); s=p.read_text(); old="    private List<Component> rewardLines(QuestAssignment assignment) {\n        return assignment.definition().rewards().entries().stream()\n                .map(reward -> text.parse(\"<dark_gray>• <gray><reward>\", Map.of(\"reward\", reward.display())))\n                .toList();\n    }\n"; new="    private List<Component> rewardLines(QuestAssignment assignment) {\n        return assignment.definition().rewards().entries().stream()\n                .map(reward -> text.parse(\n                        null,\n                        \"<dark_gray>• <reward>\",\n                        Map.of(),\n                        Map.of(\"reward\", text.parse(reward.display()))))\n                .toList();\n    }\n\n    private static String historyRewardSummary(String encoded) {\n        if (encoded == null || encoded.isBlank()) return \"Claimed\";\n        return encoded\n                .replaceFirst(\"^[A-Za-z0-9_-]+=\", \"\")\n                .replaceAll(\",[A-Za-z0-9_-]+=\", \" <dark_gray>+ \" );\n    }\n"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          git diff --check
      - name: Commit sweep
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/revamp-presentation-sweep.yml
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add src/main/java/com/zpkdxgames/plexonquests/gui/MenuService.java
          git diff --cached --check
          git commit -m 'Align compatibility menus with MiniMessage presentation'
          git push origin HEAD:revamp/4.1.0-full-standard
