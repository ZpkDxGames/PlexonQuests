name: Publish PlexonQuests 4.0.0-rc.2 once

on:
  push:
    branches:
      - phase3/release-v4.0.0-rc.2
    paths:
      - '.github/workflows/publish-phase3-rc.2-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Prove frozen ancestry and release-only delta
        run: |
          set -euo pipefail
          UX=e59eaa5d655f912cdad6dc43669ee644b5130fc3
          PERF=38be2038e3c2674724665dbe3cc5e93b7af619f9
          git merge-base --is-ancestor "$UX" HEAD
          git merge-base --is-ancestor "$PERF" HEAD
          git diff --name-only "$UX" HEAD | tee /tmp/release-delta.txt
          if grep -Ev '^(pom\.xml|\.github/workflows/build\.yml|\.github/workflows/publish-phase3-rc\.2-once\.yml|\.release/RELEASE_NOTES_4\.0\.0-rc\.2\.md)$' /tmp/release-delta.txt | grep -q .; then echo 'Non-release-only delta' >&2; exit 1; fi
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25', cache: maven}
      - name: Provision PlexonCore
        run: |
          set -euo pipefail
          core="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error -o "$core" https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$core" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Build and verify exact candidate
        run: mvn -B -ntp clean verify
      - name: Produce evidence and verify isolation
        run: |
          set -euo pipefail
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version); test "$version" = 4.0.0-rc.2
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=paper.version)" = 26.2.build.121-stable
          jar="target/PlexonQuests-${version}.jar"; test -s "$jar"; jar tf "$jar" > target/jar-contents.txt
          unzip -p "$jar" plugin.yml | grep -F "version: '${version}'"; unzip -p "$jar" plugin.yml | grep -F "api-version: '26.2'"
          for prefix in 'com/zpkdxgames/plexoncore/' 'me/clip/placeholderapi/' 'org/bukkit/' 'net/kyori/adventure/' 'net/luckperms/api/' 'net/milkbowl/vault/'; do if grep -q "^$prefix" target/jar-contents.txt; then exit 1; fi; done
          JAR_PATH="$jar" python3 - <<'PY'
          import os,zipfile,glob,xml.etree.ElementTree as ET
          with zipfile.ZipFile(os.environ['JAR_PATH']) as a: d=a.read('com/zpkdxgames/plexonquests/PlexonQuestsPlugin.class')
          if int.from_bytes(d[6:8],'big') != 69: raise SystemExit('wrong class major')
          t=f=e=s=0
          for p in glob.glob('target/surefire-reports/TEST-*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          if not t or f or e or s: raise SystemExit(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          open('target/TEST_SUMMARY.txt','w').write(f'executed={t}\nfailures={f}\nerrors={e}\nskipped={s}\n'); print(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          PY
          (cd target && sha256sum "PlexonQuests-${version}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          size=$(stat -c%s "$jar"); digest=$(sha256sum "$jar"|awk '{print $1}')
          { echo repository=$GITHUB_REPOSITORY; echo commit=$GITHUB_SHA; echo accepted_phase3=e59eaa5d655f912cdad6dc43669ee644b5130fc3; echo performance_ancestor=38be2038e3c2674724665dbe3cc5e93b7af619f9; echo version=$version; echo java_major=69; echo paper=26.2.build.121-stable; echo jar_size=$size; echo jar_sha256=$digest; echo runtime_certification=NOT_EXECUTED; } > target/PROVENANCE.txt
      - name: Publish immutable prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          TAG=v4.0.0-rc.2
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo "$TAG exists" >&2; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG release exists" >&2; exit 1; fi
          gh release create "$TAG" target/PlexonQuests-4.0.0-rc.2.jar target/SHA256SUMS.txt target/TEST_SUMMARY.txt target/PROVENANCE.txt --target "$GITHUB_SHA" --prerelease --title 'PlexonQuests 4.0.0-rc.2' --notes-file .release/RELEASE_NOTES_4.0.0-rc.2.md
