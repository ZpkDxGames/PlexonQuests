name: Apply Phase2 Closure

on:
  push:
    paths:
      - '.github/workflows/apply-phase2-closure.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase2/4.0.0-premium-journal
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Apply closure patch
        run: python3 .github/phase2_closure_patch.py
      - name: Verify patched source
        run: mvn -B -ntp clean verify
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit verified closure changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/phase2_closure_patch.py .github/workflows/apply-phase2-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close Phase 2 journal safety contracts'
          git push origin HEAD:phase2/4.0.0-premium-journal
