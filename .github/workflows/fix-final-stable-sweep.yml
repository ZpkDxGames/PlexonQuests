name: Repair final stable sweep runner

on:
  push:
    branches: [revamp/4.1.0-full-standard]
    paths: ['.github/workflows/fix-final-stable-sweep.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/4.1.0-full-standard
          fetch-depth: 0

      - name: Remove invalid no-op patch loop
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/final-stable-performance-sweep.yml')
          text = path.read_text()
          start_marker = "          for marker, objective in [\n"
          end_marker = "          p = Path(path)\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('invalid loop markers not found')
          path.write_text(text[:start] + text[end:])
          PY
          git diff --check

      - name: Commit repaired sweep
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-final-stable-sweep.yml
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add .github/workflows/final-stable-performance-sweep.yml
          git diff --cached --check
          git commit -m 'Repair final stable performance sweep'
          git push origin HEAD:revamp/4.1.0-full-standard
