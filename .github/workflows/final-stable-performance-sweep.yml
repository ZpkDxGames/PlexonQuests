name: Final 4.1 stable performance sweep

on:
  push:
    branches: [revamp/4.1.0-full-standard]
    paths: ['.github/workflows/final-stable-performance-sweep.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/4.1.0-full-standard
          fetch-depth: 0

      - name: Apply final stable source sweep
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # One allocation-free server-wide type gate before per-player/material/entity routing.
          path = 'src/main/java/com/zpkdxgames/plexonquests/service/ProgressService.java'
          marker = '    /** Cheap material-aware interest gate backed by the player\'s candidate index. */\n'
          addition = '''    /**
           * Allocation-free server-wide type gate for common Bukkit events. This is a coarse
           * rejection check only; the existing per-player candidate index remains authoritative.
           */
          public boolean anyInterested(ObjectiveType type) {
              Set<UUID> players = interestedPlayers.get(type);
              return players != null && !players.isEmpty();
          }

          '''
          replace_once(path, marker, addition + marker)

          # Reject globally irrelevant common events before entity/recipe/inventory context work.
          path = 'src/main/java/com/zpkdxgames/plexonquests/objective/tracker/CoreObjectiveListener.java'
          gates = {
              '    public void onPlace(BlockPlaceEvent event) {\n': 'PLACE_BLOCK',
              '    public void onDeath(EntityDeathEvent event) {\n': 'KILL_ENTITY',
              '    public void onDamage(EntityDamageByEntityEvent event) {\n': 'DAMAGE_ENTITY',
              '    public void onFish(PlayerFishEvent event) {\n': 'CATCH_FISH',
              '    public void onCraft(CraftItemEvent event) {\n': 'CRAFT_ITEM',
              '    public void onFurnaceExtract(FurnaceExtractEvent event) {\n': 'SMELT_ITEM',
              '    public void onEnchant(EnchantItemEvent event) {\n': 'ENCHANT_ITEM',
              '    public void onBrewingExtract(InventoryClickEvent event) {\n': 'BREW_POTION',
              '    public void onWorldChange(PlayerChangedWorldEvent event) {\n': 'VISIT_WORLD',
              '    public void onAdvancement(PlayerAdvancementDoneEvent event) {\n': 'COMPLETE_ADVANCEMENT',
          }
          p = Path(path)
          text = p.read_text()
          for signature, objective in gates.items():
              if text.count(signature) != 1:
                  raise SystemExit(f'{path}: listener marker changed: {signature!r}')
              gate = signature + f'        if (!progress.anyInterested(ObjectiveType.{objective})) {{\n            return;\n        }}\n'
              text = text.replace(signature, gate, 1)
          p.write_text(text)

          # Idle/outlier samples no longer pay Math.sqrt.
          path = 'src/main/java/com/zpkdxgames/plexonquests/objective/tracker/ActivitySampler.java'
          replace_once(path,
              '        double maximumDelta = settings.travelMaximumDelta();\n',
              '        double maximumDelta = settings.travelMaximumDelta();\n        double maximumDeltaSquared = maximumDelta * maximumDelta;\n')
          p = Path(path)
          text = p.read_text()
          if text.count('now, generation, maximumDelta, afkNanos, intervalTicks);') != 2:
              raise SystemExit('ActivitySampler call markers changed')
          text = text.replace('now, generation, maximumDelta, afkNanos, intervalTicks);',
                              'now, generation, maximumDeltaSquared, afkNanos, intervalTicks);')
          if text.count('            double maximumDelta,\n') != 1:
              raise SystemExit('ActivitySampler parameter marker changed')
          text = text.replace('            double maximumDelta,\n', '            double maximumDeltaSquared,\n', 1)
          old = '        double deltaSquared = distanceSquared(sample, current);\n        double delta = Math.sqrt(deltaSquared);\n        if (delta > 0.05D && delta <= maximumDelta) {\n'
          new = '        double deltaSquared = distanceSquared(sample, current);\n        if (deltaSquared > 0.0025D && deltaSquared <= maximumDeltaSquared) {\n            double delta = Math.sqrt(deltaSquared);\n'
          if text.count(old) != 1:
              raise SystemExit('ActivitySampler movement marker changed')
          p.write_text(text.replace(old, new, 1))

          # GUI listener is primary-thread confined; avoid CHM and duplicate unsafe-click lookup.
          path = 'src/main/java/com/zpkdxgames/plexonquests/gui/MenuListener.java'
          p = Path(path)
          text = p.read_text()
          if text.count('import java.util.EnumSet;\n') != 1:
              raise SystemExit('MenuListener EnumSet import changed')
          if text.count('import java.util.concurrent.ConcurrentHashMap;\n') != 1:
              raise SystemExit('MenuListener ConcurrentHashMap import changed')
          text = text.replace('import java.util.EnumSet;\n', '', 1)
          text = text.replace('import java.util.concurrent.ConcurrentHashMap;\n', 'import java.util.HashMap;\n', 1)
          start = text.find('    private static final EnumSet<ClickType> UNSAFE = EnumSet.of(')
          end = text.find('    private final JavaPlugin plugin;', start)
          if start < 0 or end < 0:
              raise SystemExit('MenuListener UNSAFE block changed')
          text = text[:start] + text[end:]
          if text.count('private final Map<UUID, Long> lastClick = new ConcurrentHashMap<>();') != 1:
              raise SystemExit('MenuListener lastClick marker changed')
          text = text.replace('private final Map<UUID, Long> lastClick = new ConcurrentHashMap<>();',
                              'private final Map<UUID, Long> lastClick = new HashMap<>();', 1)
          if text.count('                || UNSAFE.contains(event.getClick())\n') != 1:
              raise SystemExit('MenuListener unsafe-condition marker changed')
          p.write_text(text.replace('                || UNSAFE.contains(event.getClick())\n', '', 1))

          # Pure stable identity: no RC/SNAPSHOT suffix in the product version.
          replace_once('pom.xml', '<version>4.1.0-rc.1</version>', '<version>4.1.0</version>')
          replace_once('pom.xml',
              '<project.build.outputTimestamp>2026-09-10T00:00:00Z</project.build.outputTimestamp>',
              '<project.build.outputTimestamp>2026-09-12T00:00:00Z</project.build.outputTimestamp>')

          # Stable changelog entry.
          changelog = '''## [4.1.0] - 2026-09-12

          - Final stable full-source revamp for Java 25, Paper 26.2 and PlexonCore 2.0.4.
          - Hardened premium Quest Journal GUI interaction, formatting and progress presentation.
          - Added server-wide objective-type fast rejection before detailed common-event routing while preserving per-player material/entity indexes.
          - Reduced activity-sampler CPU for stationary and rejected outlier movement.
          - Removed unnecessary concurrent-map and duplicate click-policy overhead from the compatibility GUI listener.
          - Preserved the mature quest lifecycle, economy, persistence, provenance, prerequisite, rotation, reroll, integration and transaction authorities.
          - Stable rollback baseline: `v4.0.0` (`57a235460e5e936ca931ee8d0e96b0a424f134f8`).

          '''
          replace_once('CHANGELOG.md', '## [Unreleased]\n\n', '## [Unreleased]\n\n' + changelog)

          # Release notes consumed by the guarded stable publisher.
          notes = '''# PlexonQuests 4.1.0

          PlexonQuests 4.1.0 is the final stable full-revamp release for Paper 26.2 and Java 25.

          ## Player experience

          - Premium Quest Journal GUI with hardened click routing and next-tick exact-holder transitions.
          - Correct MiniMessage presentation across quest-facing text and readable low-progress rendering.
          - Clear active, eligible, tracked, claimable, completed and locked states without changing quest economy semantics.

          ## High-concurrency runtime

          - Common gameplay listeners now perform a constant-time server-wide objective-type rejection before detailed entity, recipe, inventory or contribution work.
          - Existing per-player material/entity candidate indexes remain the authoritative second-stage filter.
          - Travel/play-time sampling skips square-root work for stationary and rejected outlier deltas.
          - GUI click debounce uses a main-thread HashMap rather than a concurrent map and relies on the centralized click router for semantic action validation.
          - Progress remains in-memory on the primary thread while persistence stays on the bounded single-writer SQLite/WAL path.

          ## Compatibility

          - No storage/schema migration.
          - No quest/reward economy rebalance.
          - No public API or command removal.
          - Paper API: 26.2.
          - PlexonCore: 2.0.4.
          - Rollback: `v4.0.0` (`57a235460e5e936ca931ee8d0e96b0a424f134f8`).

          The stable release workflow rebuilds and tests the exact `main` SHA, verifies the installable JAR and dependency boundaries, publishes SHA-256/test/provenance evidence, then downloads and verifies the published assets again. Live MSPT remains host-dependent and must be measured on the target server rather than inferred from unit tests.
          '''
          Path('.release/RELEASE_NOTES_4.1.0.md').write_text(notes.replace('\n          ', '\n'))

          pom = Path('pom.xml').read_text()
          if '<version>4.1.0</version>' not in pom or '4.1.0-rc.1' in pom or '4.1.0-SNAPSHOT' in pom:
              raise SystemExit('Stable Maven identity check failed')
          PY
          git diff --check

      - name: Commit final stable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add pom.xml CHANGELOG.md .release/RELEASE_NOTES_4.1.0.md \
            src/main/java/com/zpkdxgames/plexonquests/service/ProgressService.java \
            src/main/java/com/zpkdxgames/plexonquests/objective/tracker/CoreObjectiveListener.java \
            src/main/java/com/zpkdxgames/plexonquests/objective/tracker/ActivitySampler.java \
            src/main/java/com/zpkdxgames/plexonquests/gui/MenuListener.java
          git diff --cached --check
          git commit -m 'Finalize PlexonQuests 4.1.0 stable performance and GUI'
          git push origin HEAD:revamp/4.1.0-full-standard
