name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        id: verify
        shell: bash
        run: |
          set +e
          mvn -B -ntp clean verify 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Publish compiler diagnostics
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          state=success
          description="Java 25 verification passed"
          if [[ "${VERIFY_EXIT:-1}" != "0" ]]; then
            state=failure
            description=$(grep -E '^\[ERROR\].*(\.java:|Failed to execute goal|Could not resolve)' build.log | head -1 | sed -E 's/^\[ERROR\][[:space:]]*//' | cut -c1-135)
            description=${description:-"Java 25 verification failed; inspect workflow logs"}
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "PlexonQuests CI" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
          if [[ "${VERIFY_EXIT:-1}" != "0" ]]; then
            exit "${VERIFY_EXIT:-1}"
          fi
      - name: Verify distribution
        run: |
          test -s target/PlexonQuests-1.0.0.jar
          jar tf target/PlexonQuests-1.0.0.jar | grep -q '^plugin.yml$'
          jar tf target/PlexonQuests-1.0.0.jar | grep -q '^org/sqlite/JDBC.class$'
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonQuests-1.0.0
          path: target/PlexonQuests-1.0.0.jar
