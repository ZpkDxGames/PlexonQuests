name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$version" = "3.3.1"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexoncore.version)" = "2.0.4"
          jar_path="target/PlexonQuests-${version}.jar"
          test -s "${jar_path}"
          jar tf "${jar_path}" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          grep -q '^com/zpkdxgames/plexonquests/integration/core/PlexonCore2Runtime.class$' target/jar-contents.txt
          unzip -p "$jar_path" plugin.yml | grep -F "version: '${version}'"
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore runtime classes must not be shaded into PlexonQuests" >&2
            exit 1
          fi
          cd target
          sha256sum "PlexonQuests-${version}.jar" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonQuests-3.3.1-Core-2.0.4-${{ github.sha }}
          path: |
            target/PlexonQuests-3.3.1.jar
            target/SHA256SUMS.txt
          if-no-files-found: error
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
