name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        run: |
          test -s target/PlexonQuests-1.0.0.jar
          jar tf target/PlexonQuests-1.0.0.jar | grep -q '^plugin.yml$'
          jar tf target/PlexonQuests-1.0.0.jar | grep -q '^org/sqlite/JDBC.class$'
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonQuests-1.0.0
          path: target/PlexonQuests-1.0.0.jar

