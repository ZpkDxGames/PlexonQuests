name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        id: verify
        shell: bash
        run: |
          set +e
          mvn -B -ntp clean verify 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Verify distribution
        id: distribution
        if: steps.verify.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          (
            set -e
            mapfile -t jars < <(find target -maxdepth 1 -type f -name 'PlexonQuests-*.jar' -print)
            test "${#jars[@]}" -eq 1
            jar_path=${jars[0]}
            test -s "${jar_path}"
            jar tf "${jar_path}" > target/jar-contents.txt
            grep -qx 'plugin.yml' target/jar-contents.txt
            grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
            sha256sum "${jar_path}" > target/SHA256SUMS.txt
            sha256sum --check target/SHA256SUMS.txt
          ) 2>&1 | tee distribution.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Publish build diagnostics
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
          DISTRIBUTION_EXIT: ${{ steps.distribution.outputs.exit_code }}
        run: |
          state=success
          description="Java 25 tests and distribution checks passed"
          if [[ "${VERIFY_EXIT:-1}" != "0" ]]; then
            state=failure
            description=$(grep -E '^\[ERROR\].*(\.java:|Failed to execute goal|Could not resolve)' build.log | head -1 | sed -E 's/^\[ERROR\][[:space:]]*//' | cut -c1-135)
            description=${description:-"Java 25 verification failed; inspect workflow logs"}
          elif [[ "${DISTRIBUTION_EXIT:-1}" != "0" ]]; then
            state=failure
            description="Packaged JAR distribution check failed"
          fi
          payload=$(jq -n \
            --arg state "$state" \
            --arg context "PlexonQuests CI" \
            --arg description "$description" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload"
      - uses: actions/upload-artifact@v4
        if: steps.verify.outputs.exit_code == '0' && steps.distribution.outputs.exit_code == '0'
        with:
          name: PlexonQuests-2.0.0
          path: |
            target/PlexonQuests-*.jar
            target/SHA256SUMS.txt
      - name: Enforce result
        if: always()
        env:
          VERIFY_EXIT: ${{ steps.verify.outputs.exit_code }}
          DISTRIBUTION_EXIT: ${{ steps.distribution.outputs.exit_code }}
        run: |
          test "${VERIFY_EXIT:-1}" = "0"
          test "${DISTRIBUTION_EXIT:-1}" = "0"
