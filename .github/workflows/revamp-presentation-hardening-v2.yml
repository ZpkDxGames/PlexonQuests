name: Apply focused 4.1 presentation hardening

on:
  push:
    branches: [revamp/4.1.0-full-standard]
    paths: ['.github/workflows/revamp-presentation-hardening-v2.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/4.1.0-full-standard
          fetch-depth: 0
      - name: Apply audited presentation patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/plexonquests-presentation-patch.py
          python3 /tmp/plexonquests-presentation-patch.py
          git diff --check
      - name: Commit presentation fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/revamp-presentation-hardening-v2.yml
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add src/main/java src/test/java
          git diff --cached --check
          git commit -m 'Fix MiniMessage rendering and shared progress bars'
          git push origin HEAD:revamp/4.1.0-full-standard
