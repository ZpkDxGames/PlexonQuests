name: Remove unreachable shift-reroll copy

on:
  push:
    branches: [revamp/4.1.0-full-standard]
    paths: ['.github/workflows/revamp-click-copy-sweep.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revamp/4.1.0-full-standard
          fetch-depth: 0

      - name: Align quest-card actions with supported click policy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          renderer = Path('src/main/java/com/zpkdxgames/plexonquests/gui/QuestItemRenderer.java')
          text = renderer.read_text()
          old = '''        output.add(text.parse(firstLine));
          if (assignment.state() == AssignmentState.ACTIVE
                  && assignment.definition().scope().rotating()
                  && configs.snapshot().settings().rerolls().enabled()
                  && player.hasPermission("plexonquests.reroll")) {
              output.add(text.parse("<light_purple>Shift-left-click <gray>reroll"));
          }
          return List.copyOf(output);'''
          new = '''        output.add(text.parse(firstLine));
          return List.copyOf(output);'''
          if text.count(old) != 1:
              raise SystemExit('QuestItemRenderer action-summary marker not found exactly once')
          renderer.write_text(text.replace(old, new, 1))

          menu = Path('src/main/java/com/zpkdxgames/plexonquests/gui/MenuService.java')
          text = menu.read_text()
          old = '''        if (click.isRightClick()) {
              togglePin(player, assignmentId, context);
          } else if (click.isShiftClick() && click.isLeftClick()) {
              rerolls.prepare(player, assignment, pending -> openRerollConfirmation(player, pending, context));
          } else if (click.isLeftClick()) {
              openDetails(player, assignment, context);
          }'''
          new = '''        if (click.isRightClick()) {
              togglePin(player, assignmentId, context);
          } else if (click.isLeftClick()) {
              openDetails(player, assignment, context);
          }'''
          if text.count(old) != 1:
              raise SystemExit('MenuService click marker not found exactly once')
          menu.write_text(text.replace(old, new, 1))

          test = Path('src/test/java/com/zpkdxgames/plexonquests/gui/MenuInteractionRouterTest.java')
          text = test.read_text()
          insert = '''
    @Test
    void compatibilityQuestCardDoesNotAdvertiseRejectedShiftReroll() throws Exception {
        String renderer = java.nio.file.Files.readString(java.nio.file.Path.of(
                "src/main/java/com/zpkdxgames/plexonquests/gui/QuestItemRenderer.java"));
        String menu = java.nio.file.Files.readString(java.nio.file.Path.of(
                "src/main/java/com/zpkdxgames/plexonquests/gui/MenuService.java"));
        assertFalse(renderer.contains("Shift-left-click"));
        assertFalse(menu.contains("click.isShiftClick()"));
    }
'''
          marker = '\n}\n'
          if insert.strip() not in text:
              pos = text.rfind(marker)
              if pos < 0:
                  raise SystemExit('MenuInteractionRouterTest closing marker not found')
              text = text[:pos] + insert + text[pos:]
              test.write_text(text)
          PY
          git diff --check

      - name: Commit click-contract cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/revamp-click-copy-sweep.yml
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add src/main/java/com/zpkdxgames/plexonquests/gui/QuestItemRenderer.java \
                  src/main/java/com/zpkdxgames/plexonquests/gui/MenuService.java \
                  src/test/java/com/zpkdxgames/plexonquests/gui/MenuInteractionRouterTest.java
          git diff --cached --check
          git commit -m 'Align quest-card actions with supported click policy'
          git push origin HEAD:revamp/4.1.0-full-standard
