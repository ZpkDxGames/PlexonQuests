name: Apply PlexonQuests 3.0 source update

on:
  push:
    branches: [agent/plexonquests-3.0.0]
    paths: ['tools/apply_3_0.py']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/plexonquests-3.0.0
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply 3.0 source transformation
        run: python tools/apply_3_0.py
      - name: Verify patch formatting
        run: git diff --check
      - name: Compile and test transformed source
        run: mvn -B -ntp clean verify
      - name: Commit transformed source
        run: |
          rm -f tools/apply_3_0.py .github/workflows/apply-3.0.yml
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git add -A
          git commit -m "PlexonQuests 3.0.0: reliability and integration release"
          git push origin HEAD:agent/plexonquests-3.0.0
