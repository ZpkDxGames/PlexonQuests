name: Apply PlexonQuests 3.0 source update

on:
  push:
    branches: [agent/plexonquests-3.0.0]
    paths:
      - 'tools/apply_3_0.py'
      - 'tools/retry_3_0'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/plexonquests-3.0.0
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply 3.0 source transformation
        run: python tools/apply_3_0.py
      - name: Apply compile correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/zpkdxgames/plexonquests/presentation/TextService.java')
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [
              r'            String replacement = allowed ? matcher.group() : "\\" + matcher.group();'
              if 'String replacement = allowed ? matcher.group()' in line else line
              for line in lines
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Keep workflow files out of self-push
        run: git checkout -- .github/workflows/build.yml
      - name: Verify patch formatting
        run: git diff --check
      - name: Compile and test transformed source
        run: mvn -B -ntp clean verify
      - name: Commit transformed source
        run: |
          rm -f tools/apply_3_0.py tools/retry_3_0
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git add -A
          git commit -m "PlexonQuests 3.0.0: reliability and integration release"
          git push origin HEAD:agent/plexonquests-3.0.0
