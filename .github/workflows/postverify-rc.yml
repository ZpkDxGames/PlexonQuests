name: RC Post-Publication Verification

on:
  push:
    branches:
      - 'release/4.0.0-rc.1-postverify'

permissions:
  contents: read
  pull-requests: read

env:
  TAG: v4.0.0-rc.1
  CANDIDATE_SHA: 3f04e2823c2ee53b67387846333ffb312cc0313a
  EXPECTED_SIZE: '37242014'
  EXPECTED_SHA256: 26108184fc97ccf81f392a01f3b32407ca99306c82a42db881be765fd4ec448b

jobs:
  verify-published-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify immutable tag target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse "${TAG}^{commit}")" = "${CANDIDATE_SHA}"

      - name: Fetch release metadata and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${auth[@]}" "${api}/releases/tags/${TAG}" -o verify/release.json

          test "$(jq -r '.tag_name' verify/release.json)" = "${TAG}"
          test "$(jq -r '.prerelease' verify/release.json)" = "true"
          test "$(jq -r '.draft' verify/release.json)" = "false"
          test "$(jq -r '.assets | length' verify/release.json)" = "4"

          expected_assets=$'PROVENANCE.txt\nPlexonQuests-4.0.0-rc.1.jar\nSHA256SUMS.txt\nTEST_SUMMARY.txt'
          actual_assets=$(jq -r '.assets[].name' verify/release.json | sort)
          test "$actual_assets" = "$expected_assets"

          jar_size=$(jq -r '.assets[] | select(.name == "PlexonQuests-4.0.0-rc.1.jar") | .size' verify/release.json)
          jar_digest=$(jq -r '.assets[] | select(.name == "PlexonQuests-4.0.0-rc.1.jar") | .digest' verify/release.json)
          test "$jar_size" = "${EXPECTED_SIZE}"
          test "$jar_digest" = "sha256:${EXPECTED_SHA256}"

          for asset in PlexonQuests-4.0.0-rc.1.jar SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt; do
            url=$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url' verify/release.json)
            test -n "$url"
            curl -fsSL "$url" -o "verify/$asset"
          done

      - name: Independently verify published bytes and reports
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c '%s' verify/PlexonQuests-4.0.0-rc.1.jar)" = "${EXPECTED_SIZE}"
          test "$(sha256sum verify/PlexonQuests-4.0.0-rc.1.jar | awk '{print $1}')" = "${EXPECTED_SHA256}"
          (cd verify && sha256sum --check SHA256SUMS.txt)

          grep -qx 'executed=98' verify/TEST_SUMMARY.txt
          grep -qx 'failures=0' verify/TEST_SUMMARY.txt
          grep -qx 'errors=0' verify/TEST_SUMMARY.txt
          grep -qx 'skipped=0' verify/TEST_SUMMARY.txt

          grep -qx 'repository=ZpkDxGames/PlexonQuests' verify/PROVENANCE.txt
          grep -qx "commit=${CANDIDATE_SHA}" verify/PROVENANCE.txt
          grep -qx 'version=4.0.0-rc.1' verify/PROVENANCE.txt
          grep -qx 'java_major=69' verify/PROVENANCE.txt
          grep -qx 'plexoncore=2.0.4' verify/PROVENANCE.txt
          grep -qx 'jar=PlexonQuests-4.0.0-rc.1.jar' verify/PROVENANCE.txt
          grep -qx "jar_size=${EXPECTED_SIZE}" verify/PROVENANCE.txt
          grep -qx "jar_sha256=${EXPECTED_SHA256}" verify/PROVENANCE.txt

          python3 - <<'PY'
          import zipfile
          path = 'verify/PlexonQuests-4.0.0-rc.1.jar'
          with zipfile.ZipFile(path) as z:
              data = z.read('com/zpkdxgames/plexonquests/PlexonQuestsPlugin.class')
              names = set(z.namelist())
          major = int.from_bytes(data[6:8], 'big')
          assert major == 69, major
          required = {'plugin.yml','config.yml','messages.yml','menus.yml','effects.yml','rarities.yml','quests/daily/stonebound.yml','org/sqlite/JDBC.class'}
          assert required <= names, required - names
          forbidden = ('com/zpkdxgames/plexoncore/','me/clip/placeholderapi/','org/bukkit/','net/kyori/adventure/','net/luckperms/api/','net/milkbowl/vault/')
          assert not any(name.startswith(forbidden) for name in names)
          print('published_jar_java_major=69')
          PY

          cat verify/TEST_SUMMARY.txt
          cat verify/PROVENANCE.txt

      - name: Verify draft PR remains open and stable release is absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsSL "${auth[@]}" "${api}/pulls/8" -o verify/pr.json
          test "$(jq -r '.state' verify/pr.json)" = 'open'
          test "$(jq -r '.draft' verify/pr.json)" = 'true'
          test "$(jq -r '.merged_at' verify/pr.json)" = 'null'
          test "$(jq -r '.head.sha' verify/pr.json)" = "${CANDIDATE_SHA}"
          test "$(jq -r '.base.ref' verify/pr.json)" = 'main'

          stable_release_code=$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "${api}/releases/tags/v4.0.0")
          stable_tag_code=$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "${api}/git/ref/tags/v4.0.0")
          test "$stable_release_code" = '404'
          test "$stable_tag_code" = '404'
          echo 'post_publication_verification=SUCCESS'
