4.2 preserves shared interest-gated listeners and narrows normal per-player objective interest through explicit participation: no joined quest means no normal objective candidates; one joined quest means only that quest's normal objectives are indexed. No per-player/per-quest listener, scheduler, synchronous gameplay DB read or repeating GUI redraw was added. Live Spark results are a separate deployment-time evidence boundary and must not be inferred from CI.

---

