          write('docs/MIGRATION_4.1.0_TO_4.2.0.md', '''# Migrating PlexonQuests 4.1.0 -> 4.2.0

## Before upgrade

1. Back up `plugins/PlexonQuests/`, especially the SQLite database and YAML configuration.
2. Record the current `v4.1.0` JAR/checksum for rollback.
3. Stop the server before replacing the plugin JAR.

Rollback baseline: `v4.1.0` / `3b0082bc181b3765e7cdb2bf4e9ce6c72206b896` / `PlexonQuests-4.1.0.jar` SHA-256 `acfcf34a829d5ff19ee1a4fa356129a121304c8b1d4473efb7471670683fa22f`.

## Behavior change

PlexonQuests 4.2 no longer automatically starts normal quests. Players choose a quest from `/quests`, and only one normal quest runs at a time by default.

Daily/Weekly slot settings are retained as period participation budgets. Existing 4.1 active assignments are **not** cancelled. If a player has more active assignments than the new limit, the profile enters legacy overflow: existing assignments remain usable/claimable, but the player cannot join a new normal quest until the active count is within policy.

Completed-but-unclaimed assignments do not consume the active runtime slot. Cancelling/abandoning a rotating quest still consumes period participation by default, and the same quest cannot be rejoined in that period.

## Configuration

Schema version remains 1. New sections are `participation`, `catalog`, and `skills-display`. Existing assignment/slot keys remain valid and become the Daily/Weekly participation-budget source.

`menus.yml` advances from layout 3 to layout 4. Exact bundled v3 defaults are backed up and replaced. Customized old menu files are backed up and preserved; the migration does not blindly overwrite administrator presentation edits.

## PlexonSkills

PlexonSkills is an optional soft dependency. Missing, disabled, incompatible or not-yet-ready skills data degrades only the Skills presentation. It must not prevent PlexonQuests from enabling and 4.2 does not add skill-level eligibility gates implicitly.

## Rerolls

Reroll configuration/API compatibility remains, but the normal player UX no longer needs rerolls because players choose an offer directly. `/quests reroll` redirects to Available Quests.

## Verification after upgrade

- confirm plugin startup/diagnostics are clean;
- open `/quests` and verify Current/Available/Completed/Skills routes;
- join one quest and confirm a second join is rejected;
- verify progress only on the joined quest;
- complete/claim or abandon and confirm interest cleanup;
- reconnect and verify assignment/period usage reconstruction;
- verify legacy multi-active profiles remain non-destructive if present;
- verify PlexonSkills available/loading/unavailable UI as applicable.

Live runtime/Spark certification is deployment evidence and is not implied by GitHub CI.
''')

          changelog = read('CHANGELOG.md')
          entry = '''## [4.2.0] - 2026-09-12

