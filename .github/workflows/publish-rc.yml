name: Publish RC Tag

on:
  push:
    branches:
      - 'release/*-publish'

permissions:
  contents: write

jobs:
  tag-verified-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate publication ref
        id: project
        shell: bash
        run: |
          set -euo pipefail
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$version" in
            *-rc.*) ;;
            *) echo "Refusing to create a stable tag from the RC publisher: $version" >&2; exit 1 ;;
          esac
          test "${GITHUB_REF_NAME}" = "release/${version}-publish"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f "releases/${version}.md"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Create immutable RC tag
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.project.outputs.version }}"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to move it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "PlexonQuests ${version}"
          git push origin "refs/tags/${tag}"
