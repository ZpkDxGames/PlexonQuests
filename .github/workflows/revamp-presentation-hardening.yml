name: Apply 4.1 presentation hardening

on:
  push:
    branches: [revamp/4.1.0-full-standard]
    paths: ['.github/workflows/revamp-presentation-hardening.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout revamp branch
        uses: actions/checkout@v5
        with:
          ref: revamp/4.1.0-full-standard
          fetch-depth: 0

      - name: Apply presentation fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          journal_path = Path('src/main/java/com/zpkdxgames/plexonquests/gui/Phase2JournalService.java')
          journal = journal_path.read_text()

          def replace_method(source, start_marker, end_marker, replacement):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement.rstrip() + '\n\n' + source[end:]

          journal = replace_method(journal,
              '    private ItemStack assignmentCard(QuestAssignment assignment, boolean trackedState) {',
              '    private ItemStack discoveryCard(DiscoveryEntry entry) {',
          '''    private ItemStack assignmentCard(QuestAssignment assignment, boolean trackedState) {
              QuestProgressPresentation progress = QuestProgressPresentation.of(
                      assignment.displayProgress().current(), assignment.displayProgress().required());
              List<Component> lore = new ArrayList<>();
              lore.add(text.parse("<dark_gray>" + scopeLabel(assignment.definition().scope()) + " • "
                      + safe(pretty(assignment.definition().category()))));
              lore.add(Component.empty());
              lore.add(text.parse(null, "<gray><objective>", Map.of(),
                      Map.of("objective", text.parse(primaryObjective(assignment)))));
              if (assignment.objectives().size() > 1) {
                  lore.add(text.parse("<gray>+" + (assignment.objectives().size() - 1) + " more"));
              }
              lore.add(progressLine(progress));
              lore.add(text.parse("<gray>" + text.formatNumber(progress.current()) + " / "
                      + text.formatNumber(progress.required())));
              lore.add(text.parse("<gray>Status " + assignmentStateColor(assignment.state())
                      + QuestStatePresentation.label(assignment.state())));
              if (assignment.state() == AssignmentState.ACTIVE) {
                  lore.add(text.parse("<gray>Tracking <yellow>" + QuestStatePresentation.tracking(trackedState)));
              }
              lore.add(text.parse(null, "<gray>Reward <reward>", Map.of(),
                      Map.of("reward", rewardSummaryComponent(assignment.definition()))));
              lore.add(Component.empty());
              lore.add(text.parse(assignment.state() == AssignmentState.COMPLETED
                      ? "<green>Click to view & claim"
                      : "<dark_gray>Click to view details"));
              return items.create(
                      assignment.definition().display().icon().material(),
                      text.parse(assignment.definition().display().name()),
                      lore,
                      trackedState || assignment.state() == AssignmentState.COMPLETED);
          }''')

          journal = replace_method(journal,
              '    private ItemStack discoveryCard(DiscoveryEntry entry) {',
              '    private ItemStack historyCard(HistoryEntry entry) {',
          '''    private ItemStack discoveryCard(DiscoveryEntry entry) {
              QuestDefinition definition = entry.definition();
              List<Component> lore = new ArrayList<>();
              lore.add(text.parse("<dark_gray>" + scopeLabel(definition.scope()) + " • "
                      + safe(pretty(definition.category()))));
              if (!definition.display().shortDescription().isBlank()) {
                  lore.add(Component.empty());
                  lore.add(text.parse(null, "<gray><description>", Map.of(),
                          Map.of("description", text.parse(definition.display().shortDescription()))));
              }
              lore.add(Component.empty());
              lore.add(text.parse("<gray>Status " + journalStateColor(entry.state())
                      + QuestStatePresentation.label(entry.state())));
              lore.add(text.parse("<gray>Assignment <white>" + assignmentMechanism(definition.scope())));
              if (entry.state() == JournalState.LOCKED) {
                  lore.add(text.parse("<gray>Requires <white>" + safe(entry.reason())));
              }
              lore.add(text.parse(null, "<gray>Reward <reward>", Map.of(),
                      Map.of("reward", rewardSummaryComponent(definition))));
              lore.add(Component.empty());
              lore.add(text.parse("<dark_gray>Click to view details"));
              return items.create(
                      definition.display().icon().material(),
                      text.parse(definition.display().name()),
                      lore,
                      entry.state() == JournalState.AVAILABLE);
          }''')

          journal = replace_method(journal,
              '    private ItemStack historyCard(HistoryEntry entry) {',
              '    private List<String> prerequisiteLore(Player player, QuestDefinition definition) {',
          '''    private ItemStack historyCard(HistoryEntry entry) {
              String when = entry.claimedAt() != null
                      ? HISTORY_DATE.format(entry.claimedAt())
                      : entry.completedAt() != null ? HISTORY_DATE.format(entry.completedAt()) : "Completed";
              Component reward = entry.rewardSummary() == null || entry.rewardSummary().isBlank()
                      ? text.parse("<white>Claimed")
                      : historyRewardSummary(entry.rewardSummary());
              List<Component> lore = List.of(
                      text.parse("<dark_gray>" + scopeLabel(entry.scope()) + " • " + safe(pretty(entry.rarity()))),
                      Component.empty(),
                      text.parse("<gray>Status <green>" + QuestStatePresentation.label(entry.state())),
                      text.parse("<gray>Completed <white>" + safe(when)),
                      text.parse(null, "<gray>Reward <reward>", Map.of(), Map.of("reward", reward)));
              return items.create(Material.BOOK, text.parse(entry.displayName()), lore, false);
          }''')

          journal = replace_method(journal,
              '    private void openDetails(Player player, QuestAssignment assignment, JournalNavigationContext parent) {',
              '    private void renderDetailsHeader(Holder holder, QuestAssignment live, boolean trackedState) {',
          '''    private void openDetails(Player player, QuestAssignment assignment, JournalNavigationContext parent) {
              PlayerProfile profile = profile(player);
              if (profile == null) return;
              QuestAssignment live = profile.assignment(assignment.id()).orElse(null);
              if (live == null) {
                  stale(player, parent);
                  return;
              }
              boolean trackedState = profile.pinnedAssignment().filter(live.id()::equals).isPresent()
                      && live.state() == AssignmentState.ACTIVE;
              Holder holder = create(parent, "<aqua><bold>Quest Details</bold>");
              topNavigation(holder, selectedForParent(parent));
              renderDetailsHeader(holder, live, trackedState);

              List<ObjectiveProgress> objectives = live.objectives();
              int visibleObjectives = Math.min(objectives.size(), DETAIL_OBJECTIVES.size());
              int directObjectives = objectives.size() > DETAIL_OBJECTIVES.size()
                      ? DETAIL_OBJECTIVES.size() - 1 : visibleObjectives;
              for (int i = 0; i < directObjectives; i++) {
                  ObjectiveProgress objective = objectives.get(i);
                  QuestProgressPresentation progress = QuestProgressPresentation.of(objective.current(), objective.required());
                  Component objectiveName = text.parse(null, "<white><bold><objective></bold>", Map.of(),
                          Map.of("objective", text.parse(objective.definition().display())));
                  componentItem(holder, DETAIL_OBJECTIVES.get(i), Material.TARGET, objectiveName, List.of(
                                  progressLine(progress),
                                  text.parse("<gray>" + text.formatNumber(progress.current()) + " / "
                                          + text.formatNumber(progress.required())),
                                  text.parse(objective.complete() ? "<green>Complete" : "<gold>In progress")),
                          objective.complete(), null);
              }
              if (objectives.size() > DETAIL_OBJECTIVES.size()) {
                  item(holder, DETAIL_OBJECTIVES.getLast(), Material.PAPER,
                          "<white><bold>+" + (objectives.size() - directObjectives) + " more objectives</bold>", List.of(
                                  "<gray>Additional objectives are part of this quest."), false, null);
              }
              QuestProgressPresentation total = QuestProgressPresentation.of(
                      live.displayProgress().current(), live.displayProgress().required());
              componentItem(holder, 20, Material.COMPASS, text.parse("<gold><bold>Overall Progress</bold>"), List.of(
                              progressLine(total),
                              text.parse("<gray>" + text.formatNumber(total.current()) + " / "
                                      + text.formatNumber(total.required())),
                              text.parse(objectives.size() > 1 ? "<gray>Objectives <white>" + objectives.size() : "")),
                      false, null);
              item(holder, 22, Material.TRIPWIRE_HOOK, "<yellow><bold>Requirements</bold>",
                      prerequisiteLore(player, live.definition()), false, null);
              item(holder, 24, Material.CLOCK, "<aqua><bold>Availability</bold>", List.of(
                      "<gray>" + assignmentMechanism(live.definition().scope()),
                      live.expiresAt().map(expiry -> "<gray>Time remaining <white>"
                                      + text.formatDuration(Duration.between(Instant.now(), expiry)))
                              .orElse("<gray>No scheduled expiry")), false, null);

              List<?> rewardEntries = live.definition().rewards().entries();
              int directRewards = rewardEntries.size() > DETAIL_REWARDS.size()
                      ? DETAIL_REWARDS.size() - 1 : rewardEntries.size();
              for (int i = 0; i < directRewards; i++) {
                  var reward = live.definition().rewards().entries().get(i);
                  componentItem(holder, DETAIL_REWARDS.get(i), Material.CHEST,
                          text.parse("<green><bold>Reward</bold>"),
                          List.of(text.parse(reward.display())), false, null);
              }
              if (rewardEntries.size() > DETAIL_REWARDS.size()) {
                  item(holder, DETAIL_REWARDS.getLast(), Material.CHEST,
                          "<green><bold>+" + (rewardEntries.size() - directRewards) + " more rewards</bold>", List.of(
                                  "<gray>Additional rewards are included."), false, null);
              }
              if (rewardEntries.isEmpty()) {
                  item(holder, 31, Material.CHEST, "<gray><bold>No listed rewards</bold>", List.of(), false, null);
              }
              List<Component> stateLore = new ArrayList<>();
              if (live.state() == AssignmentState.ACTIVE) {
                  stateLore.add(text.parse("<gray>Tracking <yellow>" + QuestStatePresentation.tracking(trackedState)));
              }
              stateLore.add(text.parse(null, "<gray>Reward summary <reward>", Map.of(),
                      Map.of("reward", rewardSummaryComponent(live.definition()))));
              componentItem(holder, 40, stateMaterial(live.state()),
                      text.parse(assignmentStateColor(live.state()) + "<bold>"
                              + QuestStatePresentation.label(live.state()) + "</bold>"),
                      stateLore, live.state() == AssignmentState.COMPLETED, null);

              back(holder, parent);
              if (live.state() == AssignmentState.COMPLETED && player.hasPermission("plexonquests.claim")) {
                  componentItem(holder, 53, Material.EMERALD, text.parse("<green><bold>Claim Reward</bold>"), List.of(
                                  text.parse(null, "<gray>Receive <reward>", Map.of(),
                                          Map.of("reward", rewardSummaryComponent(live.definition()))),
                                  Component.empty(),
                                  text.parse("<dark_gray>Click once to claim")),
                          true, (p, c) -> claim(p, live.id(), parent, holder));
              }
              if (live.state() == AssignmentState.ACTIVE
                      && live.definition().scope().rotating()
                      && configs.snapshot().settings().rerolls().enabled()
                      && player.hasPermission("plexonquests.reroll")) {
                  item(holder, 46, Material.ENDER_PEARL, "<light_purple><bold>Reroll Quest</bold>",
                          rerollLore(player, live), false, (p, c) -> {
                              if (!holder.submit("prepare-reroll")) return;
                              openReroll(p, live, parent);
                          });
              }
              refreshTrackingPresentation(player, holder, live, parent);
              close(holder);
              player.openInventory(holder.inventory);
          }''')

          journal = replace_method(journal,
              '    private void renderDetailsHeader(Holder holder, QuestAssignment live, boolean trackedState) {',
              '    private void refreshTrackingPresentation(',
          '''    private void renderDetailsHeader(Holder holder, QuestAssignment live, boolean trackedState) {
              List<Component> headerLore = new ArrayList<>();
              headerLore.add(text.parse("<dark_gray>" + scopeLabel(live.definition().scope()) + " • "
                      + safe(pretty(live.definition().category()))));
              if (!live.definition().display().shortDescription().isBlank()) {
                  headerLore.add(Component.empty());
                  headerLore.add(text.parse(null, "<gray><description>", Map.of(),
                          Map.of("description", text.parse(live.definition().display().shortDescription()))));
              }
              headerLore.add(Component.empty());
              headerLore.add(text.parse("<gray>Status " + assignmentStateColor(live.state())
                      + QuestStatePresentation.label(live.state())));
              if (live.state() == AssignmentState.ACTIVE) {
                  headerLore.add(text.parse("<gray>Tracking <yellow>" + QuestStatePresentation.tracking(trackedState)));
              }
              componentItem(holder, 4, live.definition().display().icon().material(),
                      text.parse(live.definition().display().name()), headerLore,
                      trackedState || live.state() == AssignmentState.COMPLETED, null);
          }''')

          journal = replace_method(journal,
              '    private void openDefinition(Player player, String questId, JournalNavigationContext parent) {',
              '    private void claim(Player player, UUID assignmentId, JournalNavigationContext parent, Holder holder) {',
          '''    private void openDefinition(Player player, String questId, JournalNavigationContext parent) {
              PlayerProfile profile = profile(player);
              if (profile == null) return;
              QuestDefinition definition = configs.snapshot().registry().quests().get(questId);
              if (definition == null || !definition.enabled()) {
                  stale(player, parent);
                  return;
              }
              QuestAssignment assigned = states.latest(profile, definition.id()).orElse(null);
              if (assigned != null && (assigned.state() == AssignmentState.ACTIVE
                      || assigned.state() == AssignmentState.COMPLETED
                      || assigned.state() == AssignmentState.CLAIMING)) {
                  openDetails(player, assigned, parent);
                  return;
              }
              JournalState state = states.resolve(player, profile, definition);
              Holder holder = create(parent, "<aqua><bold>Quest Details</bold>");
              topNavigation(holder, JournalView.ELIGIBLE);
              List<Component> header = new ArrayList<>();
              header.add(text.parse("<dark_gray>" + scopeLabel(definition.scope()) + " • "
                      + safe(pretty(definition.category()))));
              if (!definition.display().shortDescription().isBlank()) {
                  header.add(Component.empty());
                  header.add(text.parse(null, "<gray><description>", Map.of(),
                          Map.of("description", text.parse(definition.display().shortDescription()))));
              }
              header.add(Component.empty());
              header.add(text.parse("<gray>Status " + journalStateColor(state) + QuestStatePresentation.label(state)));
              componentItem(holder, 4, definition.display().icon().material(), text.parse(definition.display().name()),
                      header, state == JournalState.AVAILABLE, null);

              List<Component> objectives = definition.objectives().values().stream().limit(6)
                      .map(objective -> text.parse(null,
                              "<gray>• <objective> <dark_gray>×</dark_gray><white><amount>",
                              text.placeholders("amount", text.formatNumber(objective.amount())),
                              Map.of("objective", text.parse(objective.display()))))
                      .collect(java.util.stream.Collectors.toCollection(ArrayList::new));
              if (definition.objectives().size() > 6) {
                  objectives.add(text.parse("<gray>+" + (definition.objectives().size() - 6) + " more"));
              }
              componentItem(holder, 20, Material.TARGET, text.parse("<aqua><bold>Objectives</bold>"),
                      objectives, false, null);
              item(holder, 22, Material.TRIPWIRE_HOOK, "<yellow><bold>Requirements</bold>",
                      prerequisiteLore(player, definition), false, null);
              item(holder, 24, Material.CLOCK, "<white><bold>How it starts</bold>", List.of(
                      "<gray>" + assignmentMechanism(definition.scope()),
                      state == JournalState.AVAILABLE
                              ? "<aqua>Eligible now"
                              : "<gray>" + safe(lockedReason(player, profile, definition, state))), false, null);
              componentItem(holder, 31, Material.CHEST, text.parse("<green><bold>Rewards</bold>"),
                      rewardLore(definition), false, null);
              item(holder, 40, stateMaterial(state),
                      journalStateColor(state) + "<bold>" + QuestStatePresentation.label(state) + "</bold>", List.of(
                              state == JournalState.AVAILABLE
                                      ? "<gray>This quest is eligible for its normal assignment rule."
                                      : "<gray>" + safe(lockedReason(player, profile, definition, state))),
                      state == JournalState.AVAILABLE, null);
              back(holder, parent);
              item(holder, 49, stateMaterial(state), "<white><bold>Status</bold>", List.of(
                      journalStateColor(state) + QuestStatePresentation.label(state)), false, null);
              close(holder);
              player.openInventory(holder.inventory);
          }''')

          journal = replace_method(journal,
              '    private List<String> rewardLore(QuestDefinition definition) {',
              '    private List<String> rerollLore(Player player, QuestAssignment assignment) {',
          '''    private List<Component> rewardLore(QuestDefinition definition) {
              List<Component> lore = new ArrayList<>();
              definition.rewards().entries().stream().limit(6).forEach(reward ->
                      lore.add(text.parse(null, "<gray>• <reward>", Map.of(),
                              Map.of("reward", text.parse(reward.display())))));
              if (definition.rewards().entries().size() > 6) {
                  lore.add(text.parse("<gray>+" + (definition.rewards().entries().size() - 6) + " more"));
              }
              if (lore.isEmpty()) lore.add(text.parse("<gray>No listed rewards"));
              return List.copyOf(lore);
          }''')

          journal = replace_method(journal,
              '    private String rewardSummary(QuestDefinition definition) {',
              '    private String questName(String questId) {',
          '''    private Component rewardSummaryComponent(QuestDefinition definition) {
              List<com.zpkdxgames.plexonquests.reward.RewardDefinition> rewards = definition.rewards().entries();
              if (rewards.isEmpty()) return text.parse("<gray>No listed reward");
              Component summary = Component.empty();
              int shown = Math.min(2, rewards.size());
              for (int index = 0; index < shown; index++) {
                  if (index > 0) summary = summary.append(text.parse("<dark_gray> + "));
                  summary = summary.append(text.parse(rewards.get(index).display()));
              }
              int more = rewards.size() - shown;
              if (more > 0) summary = summary.append(text.parse("<dark_gray> +" + more + " more"));
              return summary;
          }

          private Component historyRewardSummary(String encoded) {
              String display = encoded == null ? "" : encoded;
              display = display.replaceFirst("^[A-Za-z0-9_-]+=", "");
              display = display.replaceAll(",[A-Za-z0-9_-]+=", " <dark_gray>+ ");
              return display.isBlank() ? text.parse("<white>Claimed") : text.parse(display);
          }

          private Component progressLine(QuestProgressPresentation progress) {
              return text.parse(
                      null,
                      "<progress_bar> <progress_color><percentage>%",
                      text.placeholders(
                              "progress_color", text.progressColor(progress.percentage()),
                              "percentage", Integer.toString(progress.percentage())),
                      Map.of("progress_bar", text.progressBar(progress.percentage())));
          }''')

          old_item = '''    private void item(Holder holder, int slot, Material material, String name, List<String> lore, boolean glow, Action action) {
              holder.inventory.setItem(slot, items.create(material, text.parse(name), components(lore), glow));
              if (action == null) holder.actions.remove(slot);
              else holder.actions.put(slot, action);
          }'''
          new_item = '''    private void item(Holder holder, int slot, Material material, String name, List<String> lore, boolean glow, Action action) {
              componentItem(holder, slot, material, text.parse(name), components(lore), glow, action);
          }

          private void componentItem(
                  Holder holder,
                  int slot,
                  Material material,
                  Component name,
                  List<Component> lore,
                  boolean glow,
                  Action action) {
              holder.inventory.setItem(slot, items.create(material, name, lore, glow));
              if (action == null) holder.actions.remove(slot);
              else holder.actions.put(slot, action);
          }'''
          if old_item not in journal:
              raise SystemExit('item helper block not found')
          journal = journal.replace(old_item, new_item, 1)
          journal_path.write_text(journal)

          text_path = Path('src/main/java/com/zpkdxgames/plexonquests/presentation/TextService.java')
          text_source = text_path.read_text()
          old_progress = '''    public Component progressBar(double percentage) {
              int segments = Math.max(1, Math.min(30, configs.snapshot().menus().integer("progress.segments", 10)));
              String filled = configs.snapshot().menus().string("progress.filled-character", "▰");
              String empty = configs.snapshot().menus().string("progress.empty-character", "▱");
              String emptyColor = configs.snapshot().menus().string("progress.empty-color", "#4B5563");
              int count = (int) Math.floor(Math.max(0D, Math.min(100D, percentage)) * segments / 100D);
              String template = "<" + progressColor(percentage) + ">" + filled.repeat(count)
                      + "<" + emptyColor + ">" + empty.repeat(segments - count);
              return parse(template);
          }'''
          new_progress = '''    public Component progressBar(double percentage) {
              int segments = Math.max(1, Math.min(30, configs.snapshot().menus().integer("progress.segments", 10)));
              String filled = configs.snapshot().menus().string("progress.filled-character", "▰");
              String empty = configs.snapshot().menus().string("progress.empty-character", "▱");
              String emptyColor = configs.snapshot().menus().string("progress.empty-color", "#4B5563");
              double clamped = Math.max(0D, Math.min(100D, percentage));
              int count = (int) Math.floor(clamped * segments / 100D);
              if (clamped > 0D && count == 0) count = 1;
              if (clamped >= 100D) count = segments;
              String template = "<" + progressColor(clamped) + ">" + filled.repeat(count)
                      + "<" + emptyColor + ">" + empty.repeat(segments - count);
              return parse(template);
          }'''
          if old_progress not in text_source:
              raise SystemExit('TextService progressBar block not found')
          text_path.write_text(text_source.replace(old_progress, new_progress, 1))

          validator_path = Path('src/main/java/com/zpkdxgames/plexonquests/config/MiniMessageValidator.java')
          validator = validator_path.read_text()
          old_validator = '''            quest.objectives().values().forEach(objective ->
                      validate(quest.source() + ".objectives." + objective.id() + ".display", objective.display(), errors));
              validate(quest.source() + ".effects.complete", quest.completeEffect(), errors);'''
          new_validator = '''            quest.objectives().values().forEach(objective ->
                      validate(quest.source() + ".objectives." + objective.id() + ".display", objective.display(), errors));
              quest.rewards().entries().forEach(reward ->
                      validate(quest.source() + ".rewards.entries." + reward.id() + ".display", reward.display(), errors));
              validate(quest.source() + ".effects.complete", quest.completeEffect(), errors);'''
          if old_validator not in validator:
              raise SystemExit('MiniMessageValidator insertion point not found')
          validator_path.write_text(validator.replace(old_validator, new_validator, 1))

          test_path = Path('src/test/java/com/zpkdxgames/plexonquests/gui/player/Phase3JournalUxArchitectureTest.java')
          test = test_path.read_text()
          insertion = '''
              @Test
              void journalUsesSharedConfiguredProgressRenderer() throws IOException {
                  String source = Files.readString(JOURNAL);
                  assertTrue(source.contains("text.progressBar(progress.percentage())"));
                  assertTrue(source.contains("text.progressColor(progress.percentage())"));
                  assertFalse(source.contains("progress.bar()"));
              }

              @Test
              void trustedQuestMiniMessageIsRenderedAsComponents() throws IOException {
                  String source = Files.readString(JOURNAL);
                  assertTrue(source.contains("rewardSummaryComponent"));
                  assertTrue(source.contains("text.parse(reward.display())"));
                  assertTrue(source.contains("text.parse(definition.display().shortDescription())"));
                  assertTrue(source.contains("text.parse(objective.display())"));
                  assertFalse(source.contains("safe(reward.display())"));
                  assertFalse(source.contains("safe(rewardSummary("));
              }
          '''
          marker = '\n}\n'
          if insertion.strip() not in test:
              pos = test.rfind(marker)
              if pos < 0: raise SystemExit('Phase3 test closing brace not found')
              test = test[:pos] + '\n' + insertion.rstrip() + test[pos:]
              test_path.write_text(test)

          reload_path = Path('src/test/java/com/zpkdxgames/plexonquests/config/ConfigManagerReloadContractTest.java')
          reload_test = reload_path.read_text()
          insertion = '''
              @Test
              void invalidRewardMiniMessageRejectsReloadAndPreservesKnownGoodSnapshot() throws Exception {
                  server = MockBukkit.mock();
                  PlexonQuestsPlugin plugin = MockBukkit.load(PlexonQuestsPlugin.class);
                  ConfigManager manager = new ConfigManager(plugin);
                  ConfigSnapshot knownGood = manager.loadInitial();
                  Path quest = manager.dataDirectory().resolve("quests/daily/stonebound.yml");
                  String original = Files.readString(quest);

                  Files.writeString(quest, original.replace(
                          "display: \\\"<aqua>350 experience points\\\"",
                          "display: \\\"<aqua350 experience points\\\""));
                  ConfigManager.ReloadResult rejected = manager.reloadAsync(Runnable::run).join();

                  assertFalse(rejected.success());
                  assertSame(knownGood, manager.snapshot());
                  assertTrue(manager.lastActivationErrors().stream().anyMatch(error ->
                          error.contains("rewards.entries.experience.display contains malformed MiniMessage")));
              }
          '''
          pos = reload_test.rfind(marker)
          if pos < 0: raise SystemExit('Config reload test closing brace not found')
          reload_test = reload_test[:pos] + '\n' + insertion.rstrip() + reload_test[pos:]
          reload_path.write_text(reload_test)
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/revamp-presentation-hardening.yml
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add src/main/java src/test/java
          git diff --cached --check
          git commit -m 'Fix MiniMessage journal rendering and progress presentation'
          git push origin HEAD:revamp/4.1.0-full-standard
