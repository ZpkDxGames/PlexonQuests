name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/release-requests/v2.0.1.yml']

permissions:
  contents: write
  actions: read

jobs:
  release-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Checksums
        working-directory: target
        run: sha256sum PlexonQuests-*.jar > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/PlexonQuests-*.jar
            target/SHA256SUMS.txt

  release-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified 2.0.1 build
        uses: actions/download-artifact@v8
        with:
          name: PlexonQuests-2.0.1
          path: target
          github-token: ${{ github.token }}
          repository: ZpkDxGames/PlexonQuests
          run-id: '33936742736'
      - name: Verify release files
        working-directory: target
        run: |
          test -s PlexonQuests-2.0.1.jar
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          unzip -tq PlexonQuests-2.0.1.jar
          unzip -Z1 PlexonQuests-2.0.1.jar | grep -qx 'plugin.yml'
          unzip -Z1 PlexonQuests-2.0.1.jar | grep -qx 'org/sqlite/JDBC.class'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          target_commitish: a7ef3ab2ed978aee0d479640a2770d46ca6fffe7
          name: PlexonQuests 2.0.1
          generate_release_notes: true
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            target/PlexonQuests-2.0.1.jar
            target/SHA256SUMS.txt
