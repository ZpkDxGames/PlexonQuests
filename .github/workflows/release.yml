name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/v3.0.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  release-3-0-0:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified main build
        uses: actions/download-artifact@v4
        with:
          name: PlexonQuests-3.0.0
          path: release-assets
          repository: ZpkDxGames/PlexonQuests
          run-id: 34071710984
          github-token: ${{ github.token }}
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/PlexonQuests-3.0.0.jar
          test -s release-assets/SHA256SUMS.txt
          cd release-assets
          sha256sum --check SHA256SUMS.txt
      - name: Publish v3.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          target_commitish: 8a4fbdfd9de9e8cf51e4a41e7ebeba41ffd4a75a
          name: PlexonQuests 3.0.0
          generate_release_notes: true
          files: |
            release-assets/PlexonQuests-3.0.0.jar
            release-assets/SHA256SUMS.txt
