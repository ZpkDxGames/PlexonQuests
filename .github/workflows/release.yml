name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/release-requests/v1.0.0.yml']

permissions:
  contents: write
  actions: read

jobs:
  release-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean verify
      - name: Checksums
        run: sha256sum target/PlexonQuests-1.0.0.jar > target/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/PlexonQuests-1.0.0.jar
            target/SHA256SUMS.txt

  release-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: 8f768f085b54f9381f3f8be0a24881ddd126fc42
          fetch-depth: 0
      - name: Create release tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0; then
            echo 'Tag v1.0.0 already exists'
          else
            git tag v1.0.0 8f768f085b54f9381f3f8be0a24881ddd126fc42
            git push origin refs/tags/v1.0.0
          fi
      - name: Download verified build
        uses: actions/download-artifact@v8
        with:
          name: PlexonQuests-1.0.0
          path: target
          github-token: ${{ github.token }}
          repository: ZpkDxGames/PlexonQuests
          run-id: '33579176251'
      - name: Verify release files
        run: |
          test -s target/PlexonQuests-1.0.0.jar
          test -s target/SHA256SUMS.txt
          sha256sum --check target/SHA256SUMS.txt
          unzip -l target/PlexonQuests-1.0.0.jar | grep -q 'plugin.yml'
          unzip -l target/PlexonQuests-1.0.0.jar | grep -q 'org/sqlite/JDBC.class'
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: 8f768f085b54f9381f3f8be0a24881ddd126fc42
          name: PlexonQuests 1.0.0
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            target/PlexonQuests-1.0.0.jar
            target/SHA256SUMS.txt
