name: Release

on:
  push:
    tags: ['v*']
    branches: ['release/**']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true
      - run: mvn -B -ntp clean verify
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          jar_path="target/PlexonQuests-${{ steps.project.outputs.version }}.jar"
          test -f "${jar_path}"
          jar tf "${jar_path}" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore runtime classes must not be shaded into PlexonQuests" >&2
            exit 1
          fi
      - name: Checksums
        working-directory: target
        run: sha256sum PlexonQuests-*.jar > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.project.outputs.version) }}
          target_commitish: ${{ startsWith(github.ref, 'refs/tags/') && github.sha || 'main' }}
          name: PlexonQuests ${{ steps.project.outputs.version }}
          generate_release_notes: true
          files: |
            target/PlexonQuests-*.jar
            target/SHA256SUMS.txt
