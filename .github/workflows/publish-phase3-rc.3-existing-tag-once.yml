name: Publish PlexonQuests 4.0.0-rc.3 existing tag once

on:
  push:
    branches:
      - phase3/publish-v4.0.0-rc.3
    paths:
      - '.github/workflows/publish-phase3-rc.3-existing-tag-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prove immutable tag target
        shell: bash
        run: |
          set -euo pipefail
          TAG=v4.0.0-rc.3
          EXPECTED=cbe59163942ccdf6a59e128c5302472efbef463e
          git fetch --force --tags origin
          test "$(git rev-parse "${TAG}^{commit}")" = "$EXPECTED"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing duplicate publication." >&2
            exit 1
          fi
          git checkout --detach "$TAG"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Build and verify exact immutable candidate
        run: mvn -B -ntp clean verify

      - name: Verify distribution and generate evidence
        shell: bash
        run: |
          set -euo pipefail
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          test "$version" = "4.0.0-rc.3"
          test "$(git rev-parse HEAD)" = "cbe59163942ccdf6a59e128c5302472efbef463e"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=paper.version)" = "26.2.build.121-stable"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexoncore.version)" = "2.0.4"

          jar="target/PlexonQuests-${version}.jar"
          test -s "$jar"
          jar tf "$jar" > target/jar-contents.txt
          for resource in plugin.yml config.yml messages.yml menus.yml effects.yml rarities.yml quests/daily/stonebound.yml; do
            grep -qx "$resource" target/jar-contents.txt
          done
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          grep -q '^com/zpkdxgames/plexonquests/integration/core/PlexonCore2Runtime.class$' target/jar-contents.txt
          unzip -p "$jar" plugin.yml | grep -F "version: '${version}'"
          unzip -p "$jar" plugin.yml | grep -F "api-version: '26.2'"
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'me/clip/placeholderapi/' \
            'org/bukkit/' \
            'net/kyori/adventure/' \
            'net/luckperms/api/' \
            'net/milkbowl/vault/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided/optional dependency classes must not be shaded: ${prefix}" >&2
              exit 1
            fi
          done

          JAR_PATH="$jar" python3 - <<'PY'
          import os, zipfile, glob, xml.etree.ElementTree as ET
          with zipfile.ZipFile(os.environ['JAR_PATH']) as archive:
              data = archive.read('com/zpkdxgames/plexonquests/PlexonQuestsPlugin.class')
          major = int.from_bytes(data[6:8], 'big')
          if major != 69:
              raise SystemExit(f'Expected Java 25 class major 69, got {major}')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if totals['tests'] == 0 or any(totals[k] for k in ('failures', 'errors', 'skipped')):
              raise SystemExit(str(totals))
          open('target/TEST_SUMMARY.txt', 'w').write(
              f"executed={totals['tests']}\nfailures={totals['failures']}\nerrors={totals['errors']}\nskipped={totals['skipped']}\n"
          )
          print(totals)
          PY

          (cd target && sha256sum "PlexonQuests-${version}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          size=$(stat -c%s "$jar")
          digest=$(sha256sum "$jar" | awk '{print $1}')
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=$(git rev-parse HEAD)"
            echo "tag=v${version}"
            echo "version=${version}"
            echo "java_major=69"
            echo "paper=26.2.build.121-stable"
            echo "plexoncore=2.0.4"
            echo "jar=$(basename "$jar")"
            echo "jar_size=${size}"
            echo "jar_sha256=${digest}"
            echo "runtime_certification=NOT_EXECUTED"
          } > target/PROVENANCE.txt
          cat target/TEST_SUMMARY.txt
          cat target/PROVENANCE.txt

      - name: Publish prerelease on existing immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v4.0.0-rc.3
          gh release create "$TAG" \
            target/PlexonQuests-4.0.0-rc.3.jar \
            target/SHA256SUMS.txt \
            target/TEST_SUMMARY.txt \
            target/PROVENANCE.txt \
            --verify-tag \
            --prerelease \
            --title 'PlexonQuests 4.0.0-rc.3' \
            --notes-file releases/4.0.0-rc.3.md
